
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coming Soon - Nova</title>
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link href="assets/vendors/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendors/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="site-wrap">
        <!-- Header -->
        <header class="fbs__net-navbar navbar navbar-expand-lg dark" aria-label="navbar">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img class="logo dark img-fluid" src="assets/images/logo-dark.svg" alt="Nova Logo">
                    <img class="logo light img-fluid" src="assets/images/logo-light.svg" alt="Nova Logo">
                </a>
                
                <div class="ms-auto">
                    <div class="header-social d-flex align-items-center gap-1">
                        <a class="btn btn-primary py-2" href="index.html">Go Home</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <section class="section first-section">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-8 mx-auto text-center">
                            <h1 class="mb-4">Coming Soon</h1>
                            <p class="lead mb-5">We're working hard to bring you something amazing. Stay tuned!</p>
                            
                            <div class="row justify-content-center mb-5">
                                <div class="col-lg-6">
                                    <div class="countdown d-flex justify-content-center gap-4">
                                        <div class="text-center">
                                            <div style="font-size: 48px; font-weight: bold; color: var(--bs-primary);" id="days">365</div>
                                            <div>Days</div>
                                        </div>
                                        <div class="text-center">
                                            <div style="font-size: 48px; font-weight: bold; color: var(--bs-primary);" id="hours">24</div>
                                            <div>Hours</div>
                                        </div>
                                        <div class="text-center">
                                            <div style="font-size: 48px; font-weight: bold; color: var(--bs-primary);" id="minutes">60</div>
                                            <div>Minutes</div>
                                        </div>
                                        <div class="text-center">
                                            <div style="font-size: 48px; font-weight: bold; color: var(--bs-primary);" id="seconds">60</div>
                                            <div>Seconds</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row justify-content-center">
                                <div class="col-md-6">
                                    <form class="d-flex gap-2">
                                        <input class="form-control" type="email" placeholder="Enter your email" required>
                                        <button class="btn btn-primary" type="submit">Notify Me</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer pt-5 pb-5">
            <div class="container">
                <div class="row credits pt-3">
                    <div class="col-12 text-center">
                        <p>&copy; 2024 Nova. All rights reserved.</p>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="assets/vendors/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/js/custom.js"></script>
</body>
</html>
