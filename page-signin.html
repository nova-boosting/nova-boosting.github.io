
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Nova</title>
    
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link href="assets/vendors/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendors/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="site-wrap">
        <!-- Header -->
        <header class="fbs__net-navbar navbar navbar-expand-lg dark" aria-label="navbar">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img class="logo dark img-fluid" src="assets/images/logo-dark.svg" alt="Nova Logo">
                    <img class="logo light img-fluid" src="assets/images/logo-light.svg" alt="Nova Logo">
                </a>
                
                <div class="ms-auto">
                    <div class="header-social d-flex align-items-center gap-1">
                        <a class="btn btn-primary py-2" href="page-signup.html">Sign Up</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main>
            <section class="section first-section">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-6 col-lg-4">
                            <div class="border rounded-4 p-5">
                                <div class="text-center mb-4">
                                    <h1>Welcome Back</h1>
                                    <p>Sign in to your Nova account</p>
                                </div>
                                
                                <form>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="email" required>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" required>
                                    </div>
                                    
                                    <div class="mb-3 d-flex justify-content-between align-items-center">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="remember">
                                            <label class="form-check-label" for="remember">Remember me</label>
                                        </div>
                                        <a href="page-forgot-password.html" class="text-decoration-none">Forgot Password?</a>
                                    </div>
                                    
                                    <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
                                </form>
                                
                                <div class="text-center">
                                    <p>Don't have an account? <a href="page-signup.html">Sign Up</a></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer pt-5 pb-5">
            <div class="container">
                <div class="row credits pt-3">
                    <div class="col-12 text-center">
                        <p>&copy; 2024 Nova. All rights reserved.</p>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="assets/vendors/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/js/custom.js"></script>
</body>
</html>
